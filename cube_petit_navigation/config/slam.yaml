amcl:
  ros__parameters:
    alpha1: 0.4 # ?
    alpha2: 0.5 # ?
    alpha3: 1.5 # ?
    alpha4: 0.2 # ?
    alpha5: 0.2 # ?
    base_frame_id: "base_link"
    beam_skip_distance: 0.5 # ?
    beam_skip_error_threshold: 0.9 # ?
    beam_skip_threshold: 0.3 # ?
    do_beamskip: false # ?
    global_frame_id: "map"
    lambda_short: 0.1 # ?
    # Laser model
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    max_beams: 30
    laser_max_range: -1.0
    laser_min_range: -1.0
    # Filter
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"

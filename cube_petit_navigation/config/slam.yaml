    update_min_d: 0.1
    z_hit: 0.95
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.05
    scan_topic: /laser/scan
    set_initial_pose: True
    initial_pose: { x: 0.0, y: 0.0, yaw: 0.0 }


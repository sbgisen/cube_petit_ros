/**/teleop_twist_joy_node:
  ros__parameters:
    # MOVE FORWARD AND BACKWARD
    axis_linear:
      x: 1
    scale_linear:
      x: 0.3
    scale_linear_turbo:
      x: 0.7
    # MOVE ROTATE
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 5.0
    # TURBO
    enable_button: 0 # X BUTTON
    enable_turbo_button: 5 # L1 BUTTON

      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 20.0 # MPPI = 1/model_dt
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    enable_stamped_cmd_vel: true #
    odom_topic: "/diff_drive_controller/odom" # need?

    progress_checker_plugins: [ progress_checker ]
    goal_checker_plugins: [ general_goal_checker ]
    controller_plugins: [ FollowPath ]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05
    FollowPath:
      # MPPI Param
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 71
      model_dt: 0.05
      # prediction_time = time_steps * model_dt = 3.55 [s] (Reference value ​​for other parameters)
      # prediction_horizon = prediction_time * max_speed = 2.485 [m] (Reference value ​​for other parameters)
      batch_size: 500
      vx_std: 0.5
      # vy_std: 0.2 # Not used in diff drive
      wz_std: 0.4
      vx_max: 0.7
      vx_min: -0.2
      # vy_max: 0.5 # Not used in diff drive
      wz_max: 1.57
      # ax_max and ax_min are not true values. Bug exists regarding acceleration/deceleration.
      # https://github.com/ros-navigation/navigation2/pull/4954
      # If the PR is merged, the values will be changed to the true values.
      ax_max: 3.0 # 0.1
      ax_min: -3.0 # -0.6
      # ay_max: 3.0 # Not used in diff drive
      az_max: 4.71
      iteration_count: 1
      prune_distance: 2.485 # prediction_horizon
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 10
        time_step: 5
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        threshold_to_consider: 0.1
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 100.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        offset_from_furthest: 24 # = prediction_time * max_speed / path_resolution / 3.0 = approx 23.66
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
        max_angle_to_furthest: 1.0
        mode: 0
    # # DWB parameters
    # FollowPath:
    #   plugin: "dwb_core::DWBLocalPlanner"
    #   debug_trajectory_details: true
    #   min_vel_x: 0.0
    #   min_vel_y: 0.0
    #   max_vel_x: 0.3
    #   max_vel_y: 0.0
    #   max_vel_theta: 1.0
    #   min_speed_xy: 0.0
    #   max_speed_xy: 0.3
    #   min_speed_theta: 0.0
    #   # Add high threshold velocity for turtlebot 3 issue.
    #   # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
    #   acc_lim_x: 0.3
    #   acc_lim_y: 0.0
    #   acc_lim_theta: 0.8
    #   decel_lim_x: -0.3
    #   decel_lim_y: 0.0
    #   decel_lim_theta: -4.8
    #   vx_samples: 10
    #   vy_samples: 5
    #   vtheta_samples: 10
    #   sim_time: 2.0
    #   linear_granularity: 0.025
    #   angular_granularity: 0.0125
    #   transform_tolerance: 0.2
    #   xy_goal_tolerance: 0.1
    #   trans_stopped_velocity: 0.25
    #   short_circuit_trajectory_evaluation: true
    #   stateful: true
    #   critics:
    #     [
    #       "RotateToGoal",

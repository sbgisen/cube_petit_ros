#
# 現地の直接操縦(joystick)・shared_controller(遠隔操縦)・navigation(自律移動)の
# 3つのcmd_velソースを優先度で調停する。timeoutを過ぎた(=そのソースが送信を止めた)
# ソースは自動的に無視され、次に優先度の高いソースへフォールバックする(例:
# コントローラのスティックを離せば自動でnavigationの制御に戻る)。
#
# Arbitrates between the three cmd_vel sources (local joystick teleop,
# shared_controller remote teleop, navigation) by priority. A source that stops
# publishing for `timeout` seconds is automatically ignored, falling back to the
# next-highest-priority active source (e.g. releasing the joystick stick
# automatically hands control back to navigation).
/**/twist_mux:
  ros__parameters:
    use_stamped: true
    # locksパラメータは意図的に省略している(ロック機構自体を使わないため)。
    # locksはtopicsと違いロック名ごとのマップなので、空リスト[]を渡すと
    # ROS2パラメータローダーが型を推論できずlaunch時にInvalidParameterValueException
    # ("parameter_value_from failed for parameter 'locks': No parameter value set")
    # でクラッシュする(実機で確認、initial_robot_namesの空リスト問題と同種)。
    #
    # The locks parameter is deliberately omitted (we don't use the lock feature).
    # Unlike topics, locks is a name-keyed map, and passing an empty list [] makes
    # the ROS2 parameter loader unable to infer a type, crashing at launch with
    # InvalidParameterValueException (confirmed on real hardware; same class of bug
    # as the empty initial_robot_names list).
    topics:
      joystick:
        topic: twist_mux/cmd_vel_joy
        timeout: 0.5
        priority: 100
      shared_controller:
        topic: twist_mux/cmd_vel_shared_controller
        timeout: 0.5
        priority: 90
      navigation:
        topic: twist_mux/cmd_vel_nav
        timeout: 0.5
        priority: 10

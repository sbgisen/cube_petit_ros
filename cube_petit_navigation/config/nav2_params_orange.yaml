emcl:
  ros__parameters:
    odom_freq: 20
    transform_tolerance: 0.2
    global_frame_id: map
    odom_frame_id: cube_petit_orange/odom
    base_frame_id: base_link
    footprint_frame_id: base_footprint
    laser_min_range: 0.0
    laser_max_range: 100000000.0
    scan_increment: 10
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    num_particles: 500
    alpha_threshold: 0.5
    expansion_radius_position: 0.1
    expansion_radius_orientation: 0.2
    extraction_rate: 0.1
    range_threshold: 0.05
    sensor_reset: false
    odom_fw_dev_per_fw: 0.19
    odom_fw_dev_per_rot: 0.0001
    odom_rot_dev_per_fw: 0.13
    odom_rot_dev_per_rot: 0.2
    laser_likelihood_max_dist: 0.2

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators:
      - navigate_to_pose
      - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # plugin_lib_names: []
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    odom_topic: /cube_petit_orange/diff_drive_controller/odom
    controller_frequency: 20.0 # = 1 / model_dt (for MPPI)
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    enable_stamped_cmd_vel: true
    progress_checker_plugins: [ progress_checker ]
    goal_checker_plugins: [ general_goal_checker ]
    controller_plugins: [ FollowPath ]
    # Progress checker parameters
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05
    # MPPI parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 71
      model_dt: 0.05
      # prediction_time = time_steps * model_dt = 3.55 [s] (Reference value ​​for other parameters)
      # prediction_horizon = prediction_time * max_speed = 2.485 [m] (Reference value ​​for other parameters)
      batch_size: 500
      vx_std: 0.5
      # vy_std: 0.2 # Not used in diff drive
      wz_std: 0.4
      vx_max: 0.7
      vx_min: -0.2
      # vy_max: 0.5 # Not used in diff drive
      wz_max: 1.57
      # ax_max and ax_min are not true values. Bug exists regarding acceleration/deceleration.
      # https://github.com/ros-navigation/navigation2/pull/4954
      # If the PR is merged, the values will be changed to the true values.
      ax_max: 3.0 # 0.1
      ax_min: -3.0 # -0.6
      # ay_max: 3.0 # Not used in diff drive
      az_max: 4.71
      iteration_count: 1
      prune_distance: 2.485 # prediction_horizon
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 10
        time_step: 5
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        threshold_to_consider: 0.1
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 100.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        offset_from_furthest: 24 # = prediction_time * max_speed / path_resolution / 3.0 = approx 23.66
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0 # adjust for overshooting, The same value as prediction_horizon(2.485) is recommended
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: cube_petit_orange/odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.01
      # yamllint disable-line rule:line-length
      footprint: "[[-0.11, 0.11], [0.11, 0.11], [0.11, -0.11], [-0.11, -0.11]]"
      footprint_padding: 0.05
      plugins:
        - laser_obstacles
        - stvl_layer
        - inflation_layer
      filters: [ keepout_filter ]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 1.0
        inflate_unknown: true
      laser_obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: laser
        combination_method: 1
        laser:
          sensor_frame: pacecat_link
          data_type: LaserScan
          topic: /cube_petit_orange/scan
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0 # 0.6
          expected_update_rate: 0.0 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: true # default false, for laser scans
          nan_is_valid: true
          raytrace_max_range: 30.0
          obstacle_max_range: 27.0
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.01
        track_unknown_space: true
        unknown_threshold: 15.0
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: head_mark head_clear
        head_mark:
          data_type: PointCloud2
          topic: cube_petit_orange/camera/depth_registered/cost_points
          marking: true
          clearing: false
          obstacle_range: 2.0
          min_obstacle_height: 0.07
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          filter: passthrough
        head_clear:
          data_type: PointCloud2
          topic: cube_petit_orange/camera/depth_registered/cost_points
          marking: false
          clearing: true
          max_z: 7.0
          min_z: 0.0
          vertical_fov_angle: 1.1345
          horizontal_fov_angle: 1.309
          decay_acceleration: 15.0
          model_type: 0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: costmap_filter_info
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.03
      track_unknown_space: true
      # yamllint disable-line rule:line-length
      footprint: "[[-0.11, 0.11], [0.11, 0.11], [0.11, -0.11], [-0.11, -0.11]]"
      footprint_padding: 0.05
      plugins:
        - static_layer
        - laser_obstacles
        - stvl_layer
        - inflation_layer
      filters: [ keepout_filter ]
      laser_obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: laser
        combination_method: 1
        laser:
          sensor_frame: pacecat_link
          data_type: LaserScan
          topic: /cube_petit_orange/scan
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0 # 0.6
          expected_update_rate: 0.0 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: true # default false, for laser scans
          nan_is_valid: true
          raytrace_max_range: 30.0
          obstacle_max_range: 27.0
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.03
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: head_mark head_clear
        head_mark:
          data_type: PointCloud2
          topic: /cube_petit_orange/camera/depth_registered/cost_points
          marking: true
          clearing: false
          obstacle_range: 2.0
          min_obstacle_height: 0.07
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          filter: passthrough
        head_clear:
          data_type: PointCloud2
          topic: /cube_petit_orange/camera/depth_registered/cost_points
          marking: false
          clearing: true
          max_z: 7.0
          min_z: 0.0
          vertical_fov_angle: 1.1345
          horizontal_fov_angle: 1.309
          decay_acceleration: 15.0
          model_type: 0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 1.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: costmap_filter_info
      always_send_full_costmap: true

map_server:
  ros__parameters:
    frame_id: map

keepout_mask_server:
  ros__parameters:
    frame_id: map
    topic_name: keepout_mask

costmap_filter_info_server:
  ros__parameters:
    type: 0
    filter_info_topic: costmap_filter_info
    base: 0.0
    multiplier: 1.0

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [ GridBased ]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.0
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [ spin, backup, wait ]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: cube_petit_orange/odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

smoother_server:
  ros__parameters:
    smoother_plugins: [ smooth_path ]
    smooth_path:
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      # whether to detect forward/reverse direction and cusps.
      # Should be set to false for paths without orientations assigned
      reversing_enabled: true
      path_downsampling_factor: 3 # every n-th node of the path is taken. Useful for speed-up
      # 0 - path remains downsampled,
      # 1 - path is upsampled back to original granularity using cubic bezier, 2... - more upsampling
      path_upsampling_factor: 1
      keep_start_orientation: true # whether to prevent the start orientation from being smoothed
      keep_goal_orientation: true # whether to prevent the gpal orientation from being smoothed
      # minimum turning radius the robot can perform. Can be set to 0.0
      # (or w_curve can be set to 0.0 with the same effect) for diff-drive/holonomic robots
      minimum_turning_radius: 0.0
      w_curve: 0.0 # weight to enforce minimum_turning_radius
      w_dist: 0.0 # weight to bind path to original as optional replacement for cost weight
      w_smooth: 15000.0 # weight to maximize smoothness of path
      w_cost: 0.015 # weight to steer robot away from collision and cost

      # Parameters used to improve obstacle avoidance near cusps (forward/reverse movement changes)
      # option to use higher weight during forward/reverse direction change
      # which is often accompanied with dangerous rotations
      w_cost_cusp_multiplier: 3.0
      # length of the section around cusp in which nodes use w_cost_cusp_multiplier
      # (w_cost rises gradually inside the zone towards the cusp point,
      # whose costmap weight eqals w_cost*w_cost_cusp_multiplier)
      cusp_zone_length: 2.5

      # Points in robot frame to grab costmap values from. Format: [x1, y1, weight1, x2, y2, weight2, ...]
      # IMPORTANT: Requires much higher number of iterations to actually improve the path.
      # Uncomment only if you really need it (highly elongated/asymmetric robots)
      # cost_check_points: [-0.185, 0.0, 1.0]

      optimizer:
        max_iterations: 70 # max iterations of smoother
        debug_optimizer: false # print debug info
        gradient_tol: 5000.0
        fn_tol: 0.0
        param_tol: 0.0

# Joy L Stick (0:Right)
teleop_twist_joy_node:
  ros__parameters:
    # ZENGO
    axis_linear:
      x: 1
    scale_linear:
      x: 0.3
    scale_linear_turbo:
      x: 0.7

    # KAITEN
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 5.0

    # TURBO
    enable_button: 0 # batu button
    enable_turbo_button: 5 # L1 shoulder button
